name: Rebase and qualify Codex-external

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official Rust release tag (blank selects newest published release)'
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: codex-external-updater
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: symbols
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Prepare candidate without changing the working branch
        id: candidate
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git config user.name 'codex-external updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin external/0.154.0-alpha.6.2
          source_sha=$(git rev-parse FETCH_HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          release="$REQUESTED_TAG"
          if [[ -z "$release" ]]; then
            release=$(gh api 'repos/openai/codex/releases?per_page=100' --jq '[.[] | select(.tag_name | startswith("rust-v"))] | sort_by(.published_at) | last | .tag_name')
          fi
          echo "Selected upstream release: $release"
          [[ "$release" =~ ^rust-v[0-9][0-9A-Za-z.-]*$ ]]
          git fetch https://github.com/openai/codex.git "refs/tags/$release:refs/tags/$release"
          base=b5bffd3ec4db487e7e3dec59663875b0ef7b72ca
          # Release-stamping commits may be siblings rather than ancestors.
          # The fixed rebase base is explicit; tests gate every candidate.
          qualified="external-qualified/${release#rust-v}/${source_sha:0:12}"
          if git ls-remote --exit-code --heads origin "$qualified" >/dev/null; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(git ls-remote --heads origin external/current | cut -f1)
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          git switch -c external-candidate "$source_sha"
          git rebase --onto "$release" "$base"
          echo "qualified=$qualified" >> "$GITHUB_OUTPUT"
          echo 'needed=true' >> "$GITHUB_OUTPUT"
      - name: Install test tools
        if: steps.candidate.outputs.needed == 'true'
        run: brew install just cargo-nextest
      - name: Resolve runner Rust target
        if: steps.candidate.outputs.needed == 'true'
        id: rust_target
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Fetch verified Codex V8 build artifacts
        if: steps.candidate.outputs.needed == 'true'
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ steps.rust_target.outputs.triple }}
      - name: Build CLI and Desktop code-mode companion
        if: steps.candidate.outputs.needed == 'true'
        working-directory: codex-rs
        run: |
          cargo build -p codex-cli -p codex-code-mode-host -j 3
          ./target/debug/codex --version
      - name: Test provider isolation and app-server agent support
        if: steps.candidate.outputs.needed == 'true'
        run: |
          node --test scripts/external-thinking.test.mjs
          just test -p codex-core -E 'test(cross_provider_subagents) | test(subagent_model_provider) | test(multi_agent_message) | test(agent::role::tests) | test(model_picker) | test(mixed_catalog) | test(selected_model_routes) | test(routed_model_replaces) | test(apply_patch)' -j 3
          just test -p codex-app-server -E 'test(automatic_openai_policy) | test(multi_agent_v2_developer_instructions) | test(thread_start_routes_model_picker_selection) | test(thread_list_mixed_catalog) | test(thread_list_respects_provider_filter) | test(thread_list_pagination) | test(suite::auth::) | test(suite::v2::account::)' -j 3
          just test -p codex-memories-write -E 'test(guard::tests::)' -j 3
      - name: Publish qualified candidate, preserving prior releases
        if: steps.candidate.outputs.needed == 'true'
        env:
          QUALIFIED: ${{ steps.candidate.outputs.qualified }}
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_now=$(git ls-remote --heads origin external/0.154.0-alpha.6.2 | cut -f1)
          [[ "$source_now" == "$SOURCE_SHA" ]] || { echo 'Patch changed during qualification; rerun against new source.'; exit 1; }
          git add codex-rs/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh release workspace versions in Cargo.lock'
          fi
          git push --atomic origin "HEAD:refs/heads/$QUALIFIED" "HEAD:refs/heads/external/current" --force-with-lease="refs/heads/external/current:$PREVIOUS"
